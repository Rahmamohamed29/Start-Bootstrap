
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start Bootstrap - Contact</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg bg-white fixed-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Start Bootstrap</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
        data-bs-target="#mainNavbar" aria-controls="mainNavbar"
        aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="resume.html">Resume</a></li>
          <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="contact-wrap">
    <div class="container">
      <div class="contact-card card border-0 shadow-sm">
        <div class="contact-icon">
          <i class="fa-regular fa-envelope"></i>
        </div>

        <h1>Get in touch</h1>
        <p class="lead">Let's work together!</p>

        <form action="#" method="post">
          <div class="mb-3">
            <label for="name" class="form-label">Full name</label>
            <input id="name" name="name" class="form-control"
              type="text" placeholder="Enter your name" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input id="email" name="email" class="form-control"
              type="email" placeholder="name@example.com" required>
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label">Phone number</label>
            <input id="phone" name="phone" class="form-control"
              type="tel" placeholder="(123) 456-7890" required>
          </div>

          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea id="message" name="message" rows="4"
              class="form-control" placeholder="Enter your message here..." required></textarea>
          </div>

          <button type="submit" class="btn submit-btn w-100">Submit</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="py-3">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
      <span>Copyright © Your Website 2023</span>
      <span><a href="#">Privacy</a> · <a href="#">Terms</a> · <a href="contact.html">Contact</a></span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
